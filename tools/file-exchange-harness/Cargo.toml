[package]
name = "tenjee-file-exchange-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
unicode-normalization = "0.1"
fs2 = "=0.4.3"
tempfile = "3"
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255", "argon2", "std"] }
argon2 = "0.5"
hmac = "=0.12.1"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rcgen = { version = "=0.14.10", features = ["zeroize"] }
zeroize = "1"
libc = "0.2"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
