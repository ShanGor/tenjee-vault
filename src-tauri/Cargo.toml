[package]
name = "tenjee-vault"
version = "1.0.0"
description = "Private, local-first notes, tasks, and calendar"
authors = ["Tenjee Vault Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tenjee_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rusqlite = { version = "0.32", features = ["backup", "bundled", "functions"] }
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-notification = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
pulldown-cmark = "0.12"
ammonia = "4"
ical = "0.11"
printpdf = { version = "0.7", features = ["embedded_images"] }
tauri-plugin-dialog = "2"
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255", "argon2", "std"] }
hmac = "=0.12.1"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rcgen = { version = "=0.14.10", features = ["zeroize"] }
mdns-sd = "=0.21.1"
if-addrs = "=0.15.0"
socket2 = "=0.6.5"
fs2 = "=0.4.3"
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
